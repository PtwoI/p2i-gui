[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2i-gui"
version = "0.4.0"
description = "Local interactive PyTorch model explorer and FastAPI bridge"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["p2i-core>=0.4,<0.5", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/PtwoI/p2i-gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p2i_gui = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
