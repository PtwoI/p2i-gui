name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-core
          path: deps/core
      - name: Use matching dependency branch when available (core)
        env:
          P2I_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git -C deps/core fetch origin "$P2I_BRANCH"; then
            git -C deps/core checkout --detach FETCH_HEAD
          fi
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ./deps/core -e ".[test]" build
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run test:unit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python tests/browser_runner.py --model mlp --scripts phase2 checkpoint ux guided
          python tests/browser_runner.py --model cnn --scripts phase2 checkpoint ux guided
          python tests/browser_runner.py --model transformer --scripts phase2 checkpoint ux phase3 explorer microscope
          python tests/browser_runner.py --model rnn --scripts guided
          python tests/browser_runner.py --model lstm --scripts guided
          python tests/browser_runner.py --model gru --scripts guided
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: docs/*.png
      - run: python -m build
